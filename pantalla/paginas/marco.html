<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>__MARCA__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;color:#1f2937;background:#f4f6fa;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.barra{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid #e5e9f0}
.marca{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}
.marca i{width:28px;height:28px;border-radius:8px;background:#1976d2;color:#fff;display:grid;place-items:center;flex:none}
.marca i svg{width:15px;height:15px;stroke-width:2}
.marca span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca small{font-size:12.5px;font-weight:400;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sep{flex:1}
.ic{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#374151}
.ic:hover,.ic[aria-expanded="true"]{background:#f1f4f9}
.ic .n{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#dc2626;color:#fff;font-size:10.5px;font-weight:600;line-height:16px;text-align:center}
.yo{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 4px;border-radius:10px;min-width:0}
.yo:hover,.yo[aria-expanded="true"]{background:#f1f4f9}
.av{width:28px;height:28px;border-radius:50%;background:#e8f1fb;color:#1565c0;font-size:11.5px;font-weight:600;display:grid;place-items:center;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.yo b{font-weight:500;font-size:13.5px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:220px;background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:6px;box-shadow:0 18px 40px -18px rgba(15,23,42,.35)}
.menu[hidden]{display:none}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:13.5px;color:#1f2937;text-decoration:none;text-align:left}
.menu a:hover,.menu button:hover{background:#f1f4f9}
.menu hr{border:0;border-top:1px solid #eef1f6;margin:6px 0}
.campana{width:340px;max-width:calc(100vw - 24px);padding:0}
.campana .cab{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eef1f6}
.campana .cab b{font-weight:600}
.campana .cab button{width:auto;padding:0;font-size:12.5px;color:#1976d2}
.campana .cab button:hover{background:none;text-decoration:underline}
.campana .lista{max-height:min(60vh,420px);overflow-y:auto;padding:6px}
.campana .aviso{display:block;width:100%;padding:10px;border-radius:8px}
.campana .aviso b{display:block;font-weight:600;font-size:13px;margin-bottom:2px}
.campana .aviso span{display:block;font-size:12.5px;color:#4b5563;line-height:1.4}
.campana .aviso small{display:block;margin-top:4px;font-size:11.5px;color:#6b7280}
.campana .aviso.nueva{background:#f3f8fe}
.campana .vacio{padding:26px 14px;text-align:center;color:#6b7280;font-size:13px}
main{flex:1;min-height:0;position:relative;overflow:hidden}
iframe{position:absolute;left:0;top:0;display:block;border:0;transform-origin:top left;width:100%;height:100%}
.ov{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px}
.ov[hidden]{display:none}
.dlg{width:100%;max-width:400px;background:#fff;border-radius:14px;padding:22px}
.dlg h2{margin:0 0 14px;font-size:17px;font-weight:600}
.dlg label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:12px}
.dlg input{display:block;width:100%;height:40px;margin-top:6px;padding:0 12px;border:1px solid #d7dde7;border-radius:10px;font:inherit;outline:none}
.dlg input:focus{border-color:#1976d2;box-shadow:0 0 0 3px rgba(25,118,210,.15)}
.dlg .pie{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{height:38px;padding:0 14px;border:1px solid #e5e9f0;border-radius:10px;background:#fff;font-weight:500;font-size:13.5px}
.btn:hover{background:#f1f4f9}
.btn.pri{background:#1976d2;border-color:#1976d2;color:#fff}
.btn.pri:hover{background:#1565c0}
.btn:disabled{opacity:.6;cursor:default}
.dlg .error{display:none;margin:0 0 12px;padding:9px 12px;border-radius:10px;background:#fef2f2;color:#b91c1c;font-size:13px}
.dlg .error.ver{display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.ver{opacity:1}
@media (max-width:759.98px){.barra{height:46px;padding:0 10px}.yo b,.marca small{display:none}}
</style>
</head>
<body>
<header class="barra">
  <div class="marca"><i><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12Z"/></svg></i><span id="marca"></span><small id="espacio"></small></div>
  <div class="sep"></div>
  <div class="dd">
    <button type="button" class="ic" id="b-campana" aria-label="Avisos" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="n" id="n-campana" hidden></span></button>
    <div class="menu campana" id="m-campana" hidden>
      <div class="cab"><b>Avisos</b><button type="button" id="b-leidas">Marcar todos como leídos</button></div>
      <div class="lista" id="avisos"></div>
    </div>
  </div>
  <div class="dd">
    <button type="button" class="yo" id="b-yo" aria-haspopup="menu" aria-expanded="false"><span class="av" id="yo-av"></span><b id="yo-n"></b></button>
    <div class="menu" id="m-yo" role="menu" hidden>
      <a href="/usuarios" id="ir-usuarios" role="menuitem" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.3a6.5 6.5 0 0 1 3.5 5.7"/></svg>Usuarios</a>
      <button type="button" id="b-clave" role="menuitem"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Cambiar la contraseña</button>
      <hr>
      <button type="button" id="b-salir" role="menuitem"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Cerrar sesión</button>
    </div>
  </div>
</header>
<main id="caja"><iframe id="marco" src="/app" title="CRM" allow="microphone; clipboard-write"></iframe></main>
<div class="ov" id="ov-clave" hidden>
  <form class="dlg" id="f-clave" role="dialog" aria-labelledby="t-clave" novalidate>
    <h2 id="t-clave">Cambiar la contraseña</h2>
    <div class="error" id="e-clave" role="alert"></div>
    <label>Contraseña actual<input id="c-actual" type="password" autocomplete="current-password"></label>
    <label>Contraseña nueva, de 10 caracteres o más<input id="c-nueva" type="password" autocomplete="new-password"></label>
    <div class="pie"><button type="button" class="btn" id="c-cancelar">Cancelar</button><button type="submit" class="btn pri" id="c-guardar">Guardar</button></div>
  </form>
</div>
<div id="toast" role="status"></div>
<script>
/*MARCO_INICIO*/
const M = window.MARCO || {yo: {}, espacio: {}};
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('ver'), 3200); }

$('marca').textContent = M.marca || 'CRM';
$('espacio').textContent = M.espacio && M.espacio.nombre && M.espacio.nombre !== M.marca ? M.espacio.nombre : '';
$('yo-n').textContent = M.yo.nombre || '';
const iniciales = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(p => p[0] || '').join('').toUpperCase();
$('yo-av').innerHTML = M.yo.foto ? `<img src="${esc(M.yo.foto)}" alt="">` : esc(iniciales(M.yo.nombre));
if (M.yo.admin) $('ir-usuarios').hidden = false;

/* ── Token del API: se pide con la cookie de la sesión y se guarda 50 minutos ── */
const tk = {v: null, en: 0, p: null};
function token(fresco){
  if (!fresco && tk.v && Date.now() - tk.en < 50 * 60_000) return Promise.resolve(tk.v);
  if (tk.p) return tk.p;
  tk.p = fetch('/api/auth/token', {credentials: 'same-origin', cache: 'no-store'}).then(async r => {
    if (r.status === 401 || r.status === 403) { location.href = '/entrar'; throw new Error('Tu sesión venció'); }
    const j = await r.json(); tk.v = j.token; tk.en = Date.now(); return tk.v;
  }).finally(() => { tk.p = null; });
  return tk.p;
}
async function api(metodo, ruta, cuerpo){
  for (let i = 0; i < 2; i++) {
    const r = await fetch('/api' + ruta, {method: metodo, cache: 'no-store', headers: {Authorization: 'Bearer ' + await token(i > 0), ...(cuerpo ? {'Content-Type': 'application/json'} : {})}, body: cuerpo ? JSON.stringify(cuerpo) : undefined});
    if (r.status === 401 && i === 0) continue;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'No se pudo completar. Intenta de nuevo.');
    return j.data;
  }
}

/* ── El CRM se dibuja a 1600 px de ancho lógico y se encoge entero en pantallas de escritorio más angostas, así
      se ven sus cuatro columnas. En celular (menos de 760 px) no se escala: ahí tiene su diseño de una columna. ── */
const ANCHO = 1600, MINIMO = 0.7, CELULAR = 760;
const caja = $('caja'), marco = $('marco');
function medir(){
  const w = caja.clientWidth, h = caja.clientHeight;
  const s = w < CELULAR ? 1 : Math.max(MINIMO, Math.min(1, w / ANCHO));
  marco.style.width = (w / s) + 'px'; marco.style.height = (h / s) + 'px'; marco.style.transform = s === 1 ? '' : `scale(${s})`;
}
medir(); new ResizeObserver(medir).observe(caja);

/* ── Menús ── */
function menu(boton, panel, alAbrir){
  boton.addEventListener('click', e => {
    e.stopPropagation();
    const abrir = panel.hidden;
    cerrarMenus();
    if (abrir) { panel.hidden = false; boton.setAttribute('aria-expanded', 'true'); if (alAbrir) alAbrir(); }
  });
  panel.addEventListener('click', e => e.stopPropagation());
}
function cerrarMenus(){ for (const [b, p] of [['b-campana', 'm-campana'], ['b-yo', 'm-yo']]) { $(p).hidden = true; $(b).setAttribute('aria-expanded', 'false'); } }
document.addEventListener('click', cerrarMenus);
window.addEventListener('blur', cerrarMenus);   // un clic dentro del CRM (el iframe) también los cierra
document.addEventListener('keydown', e => { if (e.key === 'Escape') { cerrarMenus(); cerrarClave(); } });
menu($('b-yo'), $('m-yo'));
menu($('b-campana'), $('m-campana'), cargarAvisos);

/* ── Campana ── */
const HORA = new Intl.DateTimeFormat('es-CO', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'});
function pintarGlobo(n){ const g = $('n-campana'); g.hidden = !n; g.textContent = n > 99 ? '99+' : String(n || ''); }
async function cargarAvisos(){
  try {
    const d = await api('GET', '/notificaciones');
    pintarGlobo(d.sinLeer);
    $('avisos').innerHTML = d.avisos.length ? d.avisos.map(a => `<button type="button" class="aviso${a.leidaEn ? '' : ' nueva'}" data-id="${esc(a.id)}" data-url="${esc(a.url)}">${a.titulo ? `<b>${esc(a.titulo)}</b>` : ''}<span>${esc(a.texto)}</span><small>${esc(HORA.format(new Date(a.createdAt)))}</small></button>`).join('') : '<div class="vacio">No tienes avisos.</div>';
  } catch (err) { $('avisos').innerHTML = `<div class="vacio">${esc(err.message)}</div>`; }
}
$('avisos').addEventListener('click', e => {
  const a = e.target.closest('.aviso'); if (!a) return;
  api('POST', '/notificaciones/leidas', {id: a.dataset.id}).then(contarAvisos, () => {});
  cerrarMenus();
  // El aviso abre su conversación o su página dentro del CRM, sin recargarlo.
  const q = String(a.dataset.url || '').split('?')[1] || '';
  if (q) marco.contentWindow.postMessage({tipo: 'crm-aviso', q}, location.origin);
});
$('b-leidas').addEventListener('click', () => api('POST', '/notificaciones/leidas', {}).then(cargarAvisos, err => toast(err.message)));
function contarAvisos(){ api('GET', '/notificaciones').then(d => pintarGlobo(d.sinLeer), () => {}); }

/* ── Tiempo real: el globito de la campana sube solo ── */
let fuente = null;
async function conectar(){
  try {
    const d = await api('POST', '/eventos/ticket');
    fuente = new EventSource('/api/eventos?ticket=' + encodeURIComponent(d.ticket));
    fuente.addEventListener('notificacion-nueva', contarAvisos);
    fuente.onerror = () => { fuente.close(); setTimeout(conectar, 5000); };
  } catch { setTimeout(conectar, 15000); }
}
contarAvisos(); conectar();

/* ── Contraseña y salida ── */
function cerrarClave(){ $('ov-clave').hidden = true; $('f-clave').reset(); $('e-clave').classList.remove('ver'); }
$('b-clave').addEventListener('click', () => { cerrarMenus(); $('ov-clave').hidden = false; $('c-actual').focus(); });
$('c-cancelar').addEventListener('click', cerrarClave);
$('ov-clave').addEventListener('click', e => { if (e.target === $('ov-clave')) cerrarClave(); });
$('f-clave').addEventListener('submit', async e => {
  e.preventDefault();
  const actual = $('c-actual').value, nueva = $('c-nueva').value, error = $('e-clave');
  if (!actual || nueva.length < 10) { error.textContent = !actual ? 'Escribe tu contraseña actual.' : 'La contraseña nueva debe tener 10 caracteres o más.'; error.classList.add('ver'); return; }
  $('c-guardar').disabled = true;
  try { await api('PATCH', '/auth/me/clave', {actual, nueva}); cerrarClave(); toast('Contraseña cambiada'); }
  catch (err) { error.textContent = err.message; error.classList.add('ver'); }
  finally { $('c-guardar').disabled = false; }
});
$('b-salir').addEventListener('click', async () => { try { await fetch('/api/auth/logout', {method: 'POST', credentials: 'same-origin'}); } finally { location.href = '/entrar'; } });
</script>
</body>
</html>
